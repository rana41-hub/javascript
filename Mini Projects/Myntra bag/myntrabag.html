<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myntra Bag</title>
  <style>

    .bag {

      background-color: aquamarine;
      height : 30px;
      width: 100px;
      border-radius: 24px;
      border: none;
    }

    .wishlist {

      height :40px;
      width: 180px;
      border-radius: 10px;
      border-style: solid;
    }

    .sale {

      background-color: aquamarine;
      height: 30px;
      width: 140px;
      border-radius: 24px;
      border: none;
       }

  </style>
</head>
<body>

  <button class = "bag" onclick = "cart++;
  document.querySelector('#cart_summary').innerText = `Your bag has ${cart} items`;">Add to Bag</button>
  <button class = "wishlist" onclick = "cart--;
  document.querySelector('#cart_summary').innerText = `Your bag has ${cart} items`;">MOVE TO WISHLIST</button>
  <button class = "sale" onclick = "cart+=2;
  document.querySelector('#cart_summary').innerText = `Your bag has ${cart} items`;">Add 1+1 Sale Item</button>

  <h1 id = "cart_summary">Your bag has 0 items</h1>

  <script>

    let cart = 0;
    document.querySelector('#cart_summary').innerText = `Your bag has ${cart} items`;

  </script>
  
</body>
</html>
