<!DOCTYPE html>
<html lang="en">
<head>

  <title>Event Listeners</title>
</head>
<body>
  
  <button id = "my-button">Click Me</button>

  <script>

   let buttonElement = document.querySelector('#my-button');
   let printing = event => console.log('I am clicked');
   buttonElement.addEventListener('click' , printing);

   //Removing Event Listener

   buttonElement.removeEventListener('click',printing);
     </script>
</body>
</html>
